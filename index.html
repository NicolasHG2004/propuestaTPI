<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3e5cf" />
    <meta
      name="description"
      content="Simulador 3D interactivo de cuidado y autonomía del adulto mayor: una jornada con aplicación móvil, dispositivo fijo y wearable."
    />
    <title>Cuida·Día — Un día acompañando a Rosa</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%233c7772'/%3E%3Cpath d='M50 22v56M22 50h56' stroke='%23fff3da' stroke-width='14' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game-shell">
      <canvas
        id="scene"
        tabindex="0"
        aria-label="Vista tridimensional de la vivienda de Rosa. Usa WASD o las flechas para moverte."
      ></canvas>
      <div id="sun-overlay" aria-hidden="true"></div>

      <header id="hud-top" class="hud-top">
        <section class="clock-card panel" aria-label="Hora simulada">
          <span class="eyebrow">Jornada resumida</span>
          <div class="clock-main">
            <span id="phase-icon" aria-hidden="true">☀️</span>
            <strong id="clock-time">08:10</strong>
          </div>
          <span id="phase-label" class="muted">Mañana · 08:10—18:00</span>
        </section>

        <section class="day-card panel" aria-label="Estado de la jornada">
          <div class="activity-line">
            <span class="activity-dot" aria-hidden="true"></span>
            <span id="npc-activity">Rosa está en la sala</span>
          </div>
          <div id="device-status" class="device-status"></div>
          <div id="metrics" class="metrics"></div>
        </section>

        <nav class="hud-actions" aria-label="Controles de la jornada">
          <button id="pause-btn" class="icon-button" data-action="toggle-pause" aria-label="Pausar el tiempo" title="Pausar o reanudar (Espacio)">Ⅱ</button>
          <div class="speed-group" role="group" aria-label="Velocidad del tiempo">
            <button class="speed-button active" data-action="set-speed" data-speed="1">1×</button>
            <button class="speed-button" data-action="set-speed" data-speed="2">2×</button>
            <button class="speed-button" data-action="set-speed" data-speed="4">4×</button>
          </div>
          <button class="hud-button" data-action="next-event" title="Avanzar al siguiente acontecimiento">Siguiente evento <span aria-hidden="true">→</span></button>
          <button class="hud-button primary" data-action="toggle-phone" title="Abrir o cerrar la aplicación (P)">
            <span aria-hidden="true">▣</span> Móvil <kbd>P</kbd>
            <span id="unread-badge" class="unread-badge hidden">0</span>
          </button>
          <button class="icon-button" data-action="open-settings" aria-label="Ajustes de accesibilidad" title="Ajustes">⚙</button>
          <button class="icon-button" data-action="open-help" aria-label="Ayuda y controles" title="Controles">?</button>
        </nav>
      </header>

      <aside id="guide" class="guide panel" aria-label="Guía de la jornada"></aside>

      <div id="caption" class="caption hidden" role="status" aria-live="polite"></div>
      <div id="toast-stack" class="toast-stack" role="status" aria-live="polite" aria-atomic="false"></div>
      <div id="tooltip" class="tooltip hidden" aria-hidden="true"></div>

      <div id="hint-bar" class="hint-bar" aria-label="Controles breves">
        <span><kbd>WASD</kbd> / <kbd>Flechas</kbd> mover</span>
        <span><kbd>Clic</kbd> suelo: caminar · objeto: interactuar</span>
        <span><kbd>Q</kbd><kbd>E</kbd> o arrastre derecho: cámara</span>
        <span><kbd>Rueda</kbd> zoom · <kbd>Esc</kbd> cerrar</span>
      </div>

      <div id="joystick" class="joystick" aria-label="Control táctil de movimiento">
        <div class="joystick-ring"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>

      <section id="inspector" class="inspector hidden" aria-live="polite" aria-label="Detalle del dispositivo"></section>

      <aside id="phone" class="phone hidden" role="dialog" aria-modal="false" aria-label="Aplicación móvil del cuidador">
        <div class="phone-speaker" aria-hidden="true"></div>
        <div id="phone-content" class="phone-content"></div>
      </aside>

      <div id="decision-root" class="decision-layer hidden"></div>
      <div id="modal-root"></div>
    </div>

    <noscript>
      <div class="noscript">Esta experiencia 3D necesita JavaScript activado.</div>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
